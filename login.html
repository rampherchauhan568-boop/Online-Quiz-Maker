<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Quiz Maker</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #0f0a1f;
        }
        
        .login-container {
            background: #1e1633;
            padding: 40px 35px;
            width: 100%;
            max-width: 380px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.10);
        }

        .login-container h2 {
            text-align: center;
            font-size: 30px;
            color: #F8FAFC;
            margin-bottom: 10px;
        }

        .login-container .subtitle {
            text-align: center;
            color: #D1D5DB;
            margin-bottom: 25px;
        }

        .login-container input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        .login-container input:focus {
            border-color: #a855f7;
            box-shadow: 0 0 5px #a855f755;
        }

        .login-container button {
            width: 100%;
            padding: 14px;
             background: linear-gradient(135deg, #7c3aed, #a855f7); 
            /* background-color: #6366f1; */
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
        }

        .login-container button:hover {
            opacity: 0.9;
        }

        .login-container p {
            text-align: center;
            margin-top: 22px;
            color: #D1D5DB;
        }

        .login-container a {
            color: #c084fc;
            text-decoration: none;
            font-weight: bold;
        }

        @media(max-width: 480px) {
            .login-container {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="auth-page">

        <div class="login-container">

            <h2>Welcome Back!</h2>

            <p class="subtitle">Login to your Quiz Maker account</p>

            <form id="loginForm">

                <input type="email" id="loginEmail"
                    placeholder="Enter your email" required>

                <input type="password" id="loginPassword"
                    placeholder="Enter your password" required>

                <button type="submit">Login</button>

            </form>

            <p>
                Don't have an account?
                <a href="register.html">Register</a>
            </p>

        </div>

    </div>

    <script src="auth.js"></script>

</body>
</html>
