<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Quiz Maker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-container {
            background: white;
            padding: 30px;
            width: 320px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0002;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4a67e8;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #354fc4;
        }

        p {
            text-align: center;
        }

        a {
            color: #4a67e8;
            text-decoration: none;
        }
    </style>
</head>

<body>
   
    <div class="login-container">

        <h2>Login</h2>

        <form id="loginForm">

            <input type="email" id="loginEmail"
                placeholder="Enter your email" required>

            <input type="password" id="loginPassword"
                placeholder="Enter your password" required>

            <button type="submit">Login</button>

        </form>

        <p>
            Don't have an account?
            <a href="register.html">Register</a>
        </p>

    </div>

    <script src="auth.js"></script>

</body>
</html>
